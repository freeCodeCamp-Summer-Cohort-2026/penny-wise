name: Test Penny Wise

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
        name: Testing
        deployment: false

    steps:
      - uses: actions/checkout@v4

      - name: Free build runner space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/graalvm
          docker system prune -af --volumes || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build Atlas MongoDB URI
        env:
          ATLAS_USER: ${{ secrets.ATLAS_USER }}
          ATLAS_PASSWORD: ${{ secrets.ATLAS_PASSWORD }}
          ATLAS_CLUSTER: ${{ secrets.ATLAS_CLUSTER }}
        run: |
          echo "MONGODB_URI=mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/pennywise?retryWrites=true&w=majority" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline

      - name: Start app with memory limits
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
        run: |
          docker compose -f docker-compose-atlas.yml up -d --build --remove-orphans

      - name: Wait for backend health
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:5000/api/health; do sleep 3; done'

      - name: Run backend and frontend tests
        env:
          AUTHOR_SECRET_CODE: ${{ secrets.AUTHOR_SECRET_CODE }}
        run: npm run tests

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose-atlas.yml down -v --remove-orphans
  
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
