  /course/{courseId}:
    delete:
      description: Delete Course by identifier
      operationId: deleteCourse
      parameters:
        - description: ID of the Course that needs to be deleted
          explode: false
          in: path
          name: courseId
          required: true
          schema:
            format: int64
            type: integer
          style: simple
      responses:
        '200':
          description: Course deleted
        '400':
          description: Invalid Course ID supplied
        '404':
          description: Course not found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      summary: Delete Course by identifier.
      tags:
        - course
      x-eov-operation-handler: controllers/CourseController
    get:
      description: Find Course by ID.
      operationId: getCourseById
      parameters:
        - description: ID of Course
          explode: false
          in: path
          name: courseId
          required: true
          schema:
            format: int64
            type: integer
          style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
            application/xml:
              schema:
                $ref: '#/components/schemas/Course'
          description: successful operation
        '400':
          description: Invalid Course ID supplied
        '404':
          description: Course not found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      summary: Find Course by ID.
      tags:
        - course
      x-eov-operation-handler: controllers/CourseController
  /course/catalog:
    get:
      description: Returns a list of published courses.
      operationId: getCoursesCatalog
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  format: int32
                  type: integer
                type: object
          description: successful operation
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - api_key: []
      summary: Returns list of published courses.
      tags:
        - course
      x-eov-operation-handler: controllers/CourseController
  /course/{courseId}/lesson:
    post:
      description: Create a lesson in the course.
      operationId: createLesson
      parameters:
        - description: ID of Course containing the Lesson
          explode: false
          in: path
          name: courseId
          required: true
          schema:
            format: int64
            type: integer
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lesson'
          application/xml:
            schema:
              $ref: '#/components/schemas/Lesson'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Lesson'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: Successful operation
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      summary: Create a lesson.
      tags:
        - lesson
      x-eov-operation-handler: controllers/LessonController
  /course/{courseId}/lesson/{lessonId}:
    delete:
      description:
        For valid response try integer IDs with value < 1000. Anything
        above 1000 or nonintegers will generate API errors.
      operationId: deleteLesson
      parameters:
        - description: ID of Course containing the Lesson
          explode: false
          in: path
          name: courseId
          required: true
          schema:
            format: int64
            type: integer
          style: simple
        - description: ID of the Lesson that needs to be deleted
          explode: false
          in: path
          name: lessonId
          required: true
          schema:
            format: int64
            type: integer
          style: simple
      responses:
        '200':
          description: Lesson deleted
        '400':
          description: Invalid Lesson ID supplied
        '404':
          description: Lesson not found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      summary: Delete Lesson by identifier.
      tags:
        - lesson
      x-eov-operation-handler: controllers/LessonController
    get:
      description: Find Lesson by ID in Course.
      operationId: getLessonById
      parameters:
        - description: ID of Course containing the Lesson
          explode: false
          in: path
          name: courseId
          required: true
          schema:
            format: int64
            type: integer
          style: simple
        - description: ID of Lesson that needs to be fetched
          explode: false
          in: path
          name: lessonId
          required: true
          schema:
            format: int64
            type: integer
          style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
            application/xml:
              schema:
                $ref: '#/components/schemas/Lesson'
          description: successful operation
        '400':
          description: Invalid Lesson ID supplied
        '404':
          description: Order not found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      summary: Find Lesson by ID.
      tags:
        - lesson
      x-eov-operation-handler: controllers/LessonController
  /money:
    post:
      description: Add new Money.
      operationId: addMoney
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
          application/xml:
            schema:
              $ref: '#/components/schemas/Money'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Money'
        description: Create new Money
        required: true
      responses:
        '200':
          content:
