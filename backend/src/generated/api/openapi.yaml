openapi: 3.0.4
info:
  contact:
    email: pennywise@example.com
  description:
    "This is a project created during the Summer Cohort in 20226 from [https://freecodecamp.org](https://freecodecamp.org).\
    \ It is aimed for preteens and teenagers, and the goal is to teach basic economy\
    \ literacy in a interactive way, which we hope to be a pleasant experience. Because\
    \ the users are children we advise the parents or tutors to be side by side, with\
    \ the learners."
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://freecodecamp.org/terms/
  title: Penny Wise - Economy Literacy Helper
  version: 1.0.0
externalDocs:
  description: Find out more about FreeCodeCamp
  url: https://freecodecamp.org
servers:
  - url: http://localhost:5000/api/
tags:
  - description: 'Special user to create and publish courses, modules and lessons'
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: Author
  - description: Country to use as example for currency
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: Country
  - description: Collection of modules
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: Course
  - description: Content about economy literacy
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: Lesson
  - description: Description of the currency related to Country
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: Money
  - description: Content for Lesson
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: Page
  - description: Component to allow input of multiple options
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: multiple_choice
  - description: Component to validate response
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: matching
  - description: Component to allow simulating budgeting
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: budgeting
  - description: Component to allow simulating wants vs needs
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: wants_needs
  - description: User definition and state save
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: User
  - description: Wallet discriminating money content for User or Lesson
    externalDocs:
      description: Find out more
      url: http://localhost:5000/docs
    name: Wallet
paths:
  /author:
    post:
      description: Add a new author.
      operationId: addAuthor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
          application/xml:
            schema:
              $ref: '#/components/schemas/Author'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Author'
        description: Create a new Author
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
            application/xml:
              schema:
                $ref: '#/components/schemas/Author'
          description: Successful operation
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - pennywise_auth:
            - write:users
            - read:users
      summary: Add a new author.
      tags:
        - author
      x-eov-operation-handler: controllers/AuthorController
    put:
      description: Update an existing author by Id.
      operationId: updateAuthor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
          application/xml:
            schema:
              $ref: '#/components/schemas/Author'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Author'
        description: Update an existent author
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
            application/xml:
              schema:
                $ref: '#/components/schemas/Author'
          description: Successful operation
        '400':
          description: Invalid ID supplied
        '404':
          description: Author not found
        '422':
          description: Validation exception
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - pennywise_auth:
            - write:users
            - read:users
      summary: Update an existing author.
      tags:
        - author
      x-eov-operation-handler: controllers/AuthorController
  /authorinvite/{email}:
    get:
      description: Returns the Author invitation by email.
      operationId: getAuthorInvite
      parameters:
        - description: Email of Author invitation to return
          explode: false
          in: path
          name: email
          required: true
          schema:
            type: string
          style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorInvite'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuthorInvite'
          description: Successful operation
        '400':
          description: Invalid email supplied
        '404':
          description: Author invitation not found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - api_key: []
        - pennywise_auth:
            - write:users
            - read:users
      summary: Get Author invitation by email.
      tags:
        - authorinvite
      x-eov-operation-handler: controllers/AuthorinviteController
    post:
      description: Generate an invitation to register an Author.
      operationId: authorInvite
      parameters:
        - description: Email of Author to invite.
          explode: false
          in: path
          name: email
          required: true
          schema:
            type: string
          style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInvite'
          application/xml:
            schema:
              $ref: '#/components/schemas/AuthorInvite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorInvite'
        description: Generate an invitation code
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorInvite'
            application/xml:
              schema:
                $ref: '#/components/schemas/AuthorInvite'
          description: Successful generated
        '400':
          description: Invalid input
        '422':
          description: Validation exception
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - pennywise_auth:
            - write:users
            - read:users
      summary: Generate an invitation to register an Author.
      tags:
        - authorinvite
      x-eov-operation-handler: controllers/AuthorinviteController
  /country:
