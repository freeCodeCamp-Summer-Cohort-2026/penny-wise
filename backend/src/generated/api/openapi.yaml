        '422':
          description: Validation exception
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - pennywise_auth:
            - write:users
            - read:users
      summary: Update an existing user.
      tags:
        - user
      x-eov-operation-handler: controllers/UserController
  /user/findByStatus:
    get:
      description: Multiple status values can be provided with comma separated strings.
      operationId: findUsersByStatus
      parameters:
        - description: Status values that need to be considered for filter
          explode: true
          in: query
          name: status
          required: false
          schema:
            default: active
            enum:
              - registered
              - active
              - disabled
            type: string
          style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
          description: successful operation
        '400':
          description: Invalid status value
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - pennywise_auth:
            - write:users
            - read:users
      summary: Finds Users by status.
      tags:
        - user
      x-eov-operation-handler: controllers/UserController
  /user/findByTags:
    get:
      description:
        "Multiple tags can be provided with comma separated strings. Use\
        \ tag1, tag2, tag3 for testing."
      operationId: findUsersByTags
      parameters:
        - description: Tags to filter by
          explode: true
          in: query
          name: tags
          required: false
          schema:
            items:
              type: string
            type: array
          style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
          description: successful operation
        '400':
          description: Invalid tag value
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
