openapi: 3.0.4
info:
  title: Penny Wise - Economy Literacy Helper
  description: "This is a project created during the Summer Cohort in 20226 from [https://freecodecamp.org](https://freecodecamp.org).\
    \ It is aimed for preteens and teenagers, and the goal is to teach basic economy\
    \ literacy in a interactive way, which we hope to be a pleasant experience. Because\
    \ the users are children we advise the parents or tutors to be side by side, with\
    \ the learners."
  termsOfService: https://freecodecamp.org/terms/
  contact:
    email: pennywise@example.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about FreeCodeCamp
  url: https://freecodecamp.org
servers:
- url: http://localhost:5000/api/
- url: http://192.168.4.182:5000/api/
tags:
- name: Author
  description: "Special user to create and publish courses, modules and lessons"
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: Country
  description: Country to use as example for currency
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: Course
  description: Collection of modules
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: Lesson
  description: Content about economy literacy
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: Money
  description: Description of the currency related to Country
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: Page
  description: Content for Lesson
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: multiple_choice
  description: Component to allow input of multiple options
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: matching
  description: Component to validate response
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: budgeting
  description: Component to allow simulating budgeting
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: wants_needs
  description: Component to allow simulating wants vs needs
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: User
  description: User definition and state save
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
- name: Wallet
  description: Wallet discriminating money content for User or Lesson
  externalDocs:
    description: Find out more
    url: http://localhost:5000/docs
paths:
  /author:
