        '422':
          description: Validation exception
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected error
      security:
        - pennywise_auth:
            - write:users
            - read:users
      summary: Add new Money definition.
      tags:
        - money
      x-eov-operation-handler: controllers/MoneyController
    put:
      description: Update existing money by Id.
      operationId: updateMoney
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Money'
          application/xml:
            schema:
              $ref: '#/components/schemas/Money'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Money'
        description: Update existent money
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Money'
            application/xml:
              schema:
                $ref: '#/components/schemas/Money'
          description: Successful operation
        '400':
