components:
  schemas:
    Author:
      required:
      - displayName
      - email
      - passwordHash
      type: object
      properties:
        email:
          type: string
          example: author@pennywise.app
        displayName:
          type: string
          example: Ama Author
        passwordHash:
          type: string
          example: 0102030405060708090a0b0c0d0e0f
        role:
          type: string
          example: author
        coursesCreated:
          type: array
          items:
            type: object
        profilePicUrl:
          type: string
          example: path/to/photo.jpg
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        role: author
        profilePicUrl: path/to/photo.jpg
        displayName: Ama Author
        coursesCreated:
        - {}
        - {}
        email: author@pennywise.app
        passwordHash: 0102030405060708090a0b0c0d0e0f
        updatedAt: 2000-01-23T04:56:07.000+00:00
    AuthorInvite:
      required:
      - email
      - expiringDate
      type: object
      properties:
        email:
          type: string
          example: author@pennywise.app
        expiringDate:
          type: string
          format: date-time
        code:
          type: string
          example: 0102030405060708090a0b0c0d0e0f
      example:
        code: 0102030405060708090a0b0c0d0e0f
        expiringDate: 2000-01-23T04:56:07.000+00:00
        email: author@pennywise.app
    Country:
      required:
      - code
      - name
      type: object
      properties:
        name:
          type: string
          example: United States of America
        code:
          type: string
          example: USA
      example:
        code: USA
        name: United States of America
    Course:
      required:
      - creatorId
      - name
      type: object
      properties:
        creatorId:
          type: object
        name:
          type: string
        lessons:
          type: array
          items:
            type: object
        published:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        creatorId: {}
        name: name
        published: true
        lessons:
        - {}
        - {}
        updatedAt: 2000-01-23T04:56:07.000+00:00
    Lesson:
      required:
      - courseId
      - description
      - name
      type: object
      properties:
        courseId:
          type: object
        name:
          type: string
        experience:
          type: number
        pages:
          type: array
          items:
            type: object
        estimatedDurationOfCompletionInMinutes:
          type: number
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        pages:
        - {}
        - {}
        name: name
        description: description
        estimatedDurationOfCompletionInMinutes: 6.02745618307040320615897144307382404804229736328125
        experience: 0.80082819046101150206595775671303272247314453125
        courseId: {}
        updatedAt: 2000-01-23T04:56:07.000+00:00
    Money:
