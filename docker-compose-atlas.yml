services:
  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    depends_on:
      - backend
    ports:
      - "5173:5173"
